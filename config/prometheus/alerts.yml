groups:
  - name: observability-alerts

    rules:

      - alert: ApplicationDown
        expr: up{job="observability-api"} == 0
        for: 30s
        labels:
          severity: critical

        annotations:
          summary: "Observability API is down"
          description: "Prometheus cannot scrape the FastAPI application."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="observability-api",status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total{job="observability-api"}[1m]))
          ) > 0.10

        for: 30s

        labels:
          severity: warning

        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 10% of application requests are returning 5xx responses."

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(
              rate(http_request_duration_seconds_bucket{job="observability-api"}[2m])
            ) by (le)
          ) > 1

        for: 30s

        labels:
          severity: warning

        annotations:
          summary: "High API latency"
          description: "95th percentile API latency is above 1 second."
