services:

  # =====================================================
  # FastAPI Application
  # =====================================================

  app:

    build:
      context: ./app

    container_name: observability-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      OTEL_SERVICE_NAME: observability-demo-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

    networks:
      - observability

    depends_on:
      - jaeger


  # =====================================================
  # Prometheus
  # =====================================================

  prometheus:

    image: prom/prometheus:v3.5.0

    container_name: prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    networks:
      - observability


  # =====================================================
  # Loki
  # =====================================================

  loki:

    image: grafana/loki:3.5.0

    container_name: loki

    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    networks:
      - observability


  # =====================================================
  # Promtail
  # =====================================================

  promtail:

    image: grafana/promtail:3.5.0

    container_name: promtail

    restart: unless-stopped

    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      - "-config.file=/etc/promtail/config.yml"

    networks:
      - observability

    depends_on:
      - loki


  # =====================================================
  # Jaeger
  # =====================================================

  jaeger:

    image: jaegertracing/all-in-one:1.76.0

    container_name: jaeger

    restart: unless-stopped

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    networks:
      - observability


  # =====================================================
  # Grafana
  # =====================================================

  grafana:

    image: grafana/grafana:12.1.1

    container_name: grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana

      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro

      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - observability

    depends_on:
      - prometheus
      - loki
      - jaeger


# =======================================================
# Networks
# =======================================================

networks:

  observability:
    driver: bridge


# =======================================================
# Persistent Volumes
# =======================================================

volumes:

  prometheus-data:

  grafana-data:

  loki-data:

